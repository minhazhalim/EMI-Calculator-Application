<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width,initial-scale=1.0">
     <title>Loan Calculator Application</title>
     <link rel="stylesheet" href="design.css">
     <script src="development.js" defer></script>
</head>
<body>
     <div class="container">
          <h2>loan calculator</h2>
          <div class="range-input">
               <label for="loan-amount">loan amount($):</label>
               <input type="range" id="loan-amount" min="1000" max="100000" step="1000" value="50000">
               <div class="range-value" id="loan-amount-value">$50000</div>
          </div>
          <div class="range-input">
               <label for="interest-rate">interest rate(%):</label>
               <input type="range" id="interest-rate" min="1" max="20" step="0.1" value="5">
               <div class="range-value" id="interest-rate-value">5%</div>
          </div>
          <div class="range-input">
               <label for="loan-tenure">loan tenure(years):</label>
               <input type="range" id="loan-tenure" min="1" max="30" step="1" value="15">
               <div class="range-value" id="loan-tenure-value">15 years</div>
          </div>
          <div class="result" id="monthly-payment">monthly payment $0</div>
     </div>
</body>
</html>
